version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: opssaathi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: opssaathi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: opssaathi-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/opssaathi
      JWT_SECRET: opssaathi-docker-secret-key-2026
      LLM_PROVIDER: gemini
      DEMO_DATA_MODE: "true"
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: opssaathi-web
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
